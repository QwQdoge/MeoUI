name: Dependency refresh temporary

on:
  push:
    branches:
      - chore/deps-latest-20260831

permissions:
  contents: write

jobs:
  resolve-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Resolve latest stable npm dependencies
        working-directory: docs
        run: |
          npx --yes npm-check-updates@latest -u --target latest
          npm install
      - name: Commit resolver outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/package.json docs/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): resolve latest stable npm dependencies'
            git push
          fi
      - name: Test docs
        working-directory: docs
        run: npm test -- --runInBand
