name: Temporary docs dependency refresh

on:
  push:
    branches:
      - chore/docs-jest-30-5-1-20260903

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Refresh Jest lock
        working-directory: docs
        run: npm install --save-dev --package-lock-only jest@30.5.1
      - name: Validate docs tests
        working-directory: docs
        run: |
          npm ci
          npm test
      - name: Commit resolver output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/package.json docs/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): update Jest to 30.5.1'
            git push
          fi
