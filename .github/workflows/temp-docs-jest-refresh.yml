name: Temporary docs Jest refresh validation

on:
  push:
    branches:
      - automation/docs-jest-30.5.1-20260904

permissions:
  contents: write

concurrency:
  group: temp-docs-jest-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Resolve Jest 30.5.1 lockfile
        run: npm install --save-dev jest@30.5.1 --package-lock-only
      - name: Ensure resolver kept intended manifest
        run: git diff --exit-code -- package.json
      - name: Clean install
        run: npm ci
      - name: Run Jest tests
        run: npm test -- --runInBand
      - name: Production high-severity audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit resolved lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): refresh Jest lockfile'
            git push
          fi
