name: Dependency refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Resolve latest stable npm dependencies
        run: |
          npx --yes npm-check-updates@latest -u
          npm install
          npm outdated || true
      - name: Run docs tests
        run: npm test -- --runInBand
      - name: Commit resolved manifests
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/package.json docs/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(deps): resolve latest stable npm dependency set'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
