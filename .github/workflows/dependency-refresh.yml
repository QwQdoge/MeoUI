name: Dependency refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  npm-refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Refresh npm dependencies
        run: |
          npx --yes npm-check-updates@latest -u
          npm install
          npm outdated || true
      - name: Run docs tests
        run: npm test -- --runInBand
      - name: Upload resolved npm manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meoui-npm-dependency-refresh
          path: |
            docs/package.json
            docs/package-lock.json
