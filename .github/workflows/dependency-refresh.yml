name: Dependency refresh

on:
  push:
    branches:
      - chore/deps-latest-20260831

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/deps-latest-20260831
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Resolve latest stable npm dependencies
        working-directory: docs
        run: |
          npm ci
          npx npm-check-updates@latest -u --target latest
          npm install
          npx npm-check-updates@latest --target latest
      - name: Test docs
        working-directory: docs
        run: npm test -- --runInBand
      - name: Audit
        working-directory: docs
        run: npm audit --audit-level=high
      - name: Commit resolved manifests
        run: |
          rm .github/workflows/dependency-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/package.json docs/package-lock.json .github/workflows/dependency-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): refresh docs dependencies"
          git push origin HEAD:chore/deps-latest-20260831
