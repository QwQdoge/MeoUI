name: Temporary docs dependency resolver

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: meoui-docs-dependency-resolver
  cancel-in-progress: false

jobs:
  resolve:
    if: contains(github.event.head_commit.message, '[resolve-jsdom]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Remove unused direct jsdom dependency
        run: npm uninstall jsdom --save-dev --package-lock-only --ignore-scripts
      - name: Verify docs tests
        run: |
          npm ci
          npm test
      - name: Ensure only docs dependency files changed
        working-directory: .
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          expected=$(printf '%s\n' 'docs/package-lock.json' 'docs/package.json')
          if [ "$(printf '%s\n' "$changed" | sort)" != "$(printf '%s\n' "$expected" | sort)" ]; then
            echo "Unexpected working tree changes:"
            printf '%s\n' "$changed"
            exit 1
          fi
      - name: Commit the minimal docs dependency update
        working-directory: .
        run: |
          git add docs/package.json docs/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): remove unused direct jsdom dependency"
          git push origin HEAD:main
